 {id:'sd',t:'ch',l:'Son de suppression',o:OO},

 SEC.forEach(([t,cs])=>{h+=`<h3>${t}</h3>`;cs.forEach(c=>{

function mark(){pan.querySelectorAll('[data-id]').forEach(b=>b.classList.toggle('on',String(P[b.dataset.id])===b.dataset.v));

/* ---------- Rendu : texte, curseur, cône de lumière ---------- */
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function follow(now){if(readonly)return;const c=$('c').getBoundingClientRect(),vh=window.visualViewport?visualViewport.height:innerHeight,d=c.top+12-vh*(touch?.4:.5);
 if(Math.abs(d)>3)scrollBy({top:d,behavior:now?'instant':'smooth'})}
/* ---------- Supprimer = rayer ---------- */
function reconcile(e){if(readonly||(e&&e.isComposing))return;const nv=ta.value;if(nv===val0)return;
 let i=0,o=val0.length,n=nv.length;while(i<o&&i<n&&val0[i]===nv[i])i++;let j=0;while(j<o-i&&j<n-i&&val0[o-1-j]===nv[n-1-j])j++;
 const rem=val0.slice(i,o-j),ins=nv.slice(i,n-j),was=mk.slice(i,o-j),zeros=Array(ins.length).fill(0);let nm,caret=i+ins.length;
 if(rem){nm=mk.slice(0,i).concat(was.map(()=>1),zeros,mk.slice(o-j));caret=i+rem.length+ins.length;ta.value=val0.slice(0,i)+rem+ins+val0.slice(o-j);
  if(!ins&&was.every(x=>x===1)){let k=i-1;while(k>=0&&nm[k]===1)k--;if(k>=0)nm[k]=1}}
 else nm=mk.slice(0,i).concat(zeros,mk.slice(o-j));
 mk=nm;val0=ta.value;ta.setSelectionRange(caret,caret)}
ta.addEventListener('input',reconcile);ta.addEventListener('compositionend',()=>{reconcile();render();save()});
ta.addEventListener('keydown',e=>{if(readonly||e.isComposing||(e.key!=='Backspace'&&e.key!=='Delete'))return;e.preventDefault();
 const v=ta.value,a=ta.selectionStart,b=ta.selectionEnd,mark=i=>{mk[i]=1};let c=b;
 if(a!==b){for(let i=a;i<b;i++)mark(i)}
 else if(e.key==='Backspace'){let j=a-1,st=(e.ctrlKey||e.altKey)?0:2;
  while(j>=0){if(mk[j]===1){j--;continue}const sp=/\s/.test(v[j]);if(st===2){mark(j);break}
   if(st===0){if(sp){mark(j);j--;continue}st=1}if(sp)break;mark(j);j--}c=a}
 else{let j=a;while(j<v.length&&mk[j]===1)j++;if(j<v.length){mark(j);c=j+1}else c=a}
 ta.setSelectionRange(c,c);render();follow();save()});
['input','keyup','click','focus'].forEach(e=>ta.addEventListener(e,()=>{render();follow()}));
document.addEventListener('selectionchange',()=>{if(document.activeElement===ta)render()});
addEventListener('scroll',render,{passive:true});addEventListener('resize',()=>{render();follow(1)});
if(window.visualViewport)visualViewport.addEventListener('resize',()=>{render();follow(1)});

/* ---------- Page du jour ---------- */
function load(k){viewing=k;const t=G('dt:day:'+k)||'';ta.value=t;val0=t;{const sm=G('dt:mask:'+k)||'';mk=t.split('').map((_,i)=>sm[i]==='1'?1:0)}readonly=k!==today||G('dt:lock:'+k)==='1';ta.readOnly=readonly;
 document.body.classList.toggle('ro',readonly);$('date').textContent=fmt(k);
 const pos=readonly?0:+(G('dt:pos:'+k)||t.length);ta.setSelectionRange(pos,pos);render();
 if(readonly)scrollTo(0,0);else{follow(1);if(!touch)ta.focus()}render()}
function save(){if(readonly||viewing!==today)return;if(ta.value.length){S('dt:day:'+today,ta.value);S('dt:mask:'+today,mk.join(''))}else try{localStorage.removeItem(NS+'dt:day:'+today);localStorage.removeItem(NS+'dt:mask:'+today)}catch(e){}S('dt:pos:'+today,ta.selectionStart);$('sy').textContent=col?'…':'·';const sg=ta.value+'|'+mk.join('');if(sg!==lastSg){lastSg=sg;S('dt:edit:'+today,Date.now());qp('day-'+today)}}
ta.addEventListener('input',()=>{$('sy').textContent='…';save()});
ta.addEventListener('keyup',()=>{if(!readonly)S('dt:pos:'+today,ta.selectionStart)});
addEventListener('pagehide',save);
function tick(){const n=dkey();if(n!==today){save();const old=today;today=n;qp('day-'+old);if(!$('lib').classList.contains('on'))load(today)}}
document.addEventListener('visibilitychange',()=>{save();tick()});setInterval(tick,15000);
ta.addEventListener('beforeinput',e=>{if(readonly||viewing!==today||/^history/.test(e.inputType))e.preventDefault()}); /* garde-fou d'interface : la vraie garantie sera côté serveur */
ta.addEventListener('keydown',e=>{if(readonly)return;if(e.key==='Enter')snd('ret');else if(e.key==='Backspace'||e.key==='Delete')snd('del');else if(e.key.length===1&&!e.ctrlKey&&!e.metaKey)snd('key')});
ta.addEventListener('input',e=>{if(/Android|iPhone|iPad/i.test(navigator.userAgent)){const t=e.inputType||'';/Break|Paragraph/.test(t)?snd('ret'):t.startsWith('delete')?snd('del'):snd('key')}});

/* ---------- Bibliothèque (lecture seule) ---------- */
function clean(k){const t=G('dt:day:'+k)||'',sm=G('dt:mask:'+k)||'';return t.split('').filter((_,i)=>sm[i]!=='1').join('')}
function keys(){const r=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith(NS+'dt:day:'))r.push(k.slice(NS.length+7))}}catch(e){}return r}
function list(){const q=$('q').value.toLowerCase(),L=$('list');L.innerHTML='';let mo='';$('rnd').textContent='✦ Une page au hasard';
 if(!q){const md=today.slice(5);keys().filter(k=>k<today&&k.slice(5)===md&&clean(k).trim()).sort().reverse().forEach(k=>{const n=+today.slice(0,4)-+k.slice(0,4),h=document.createElement('h3');h.textContent='Il y a '+n+(n>1?' ans':' an')+', aujourd’hui';L.appendChild(h);const b=document.createElement('button');b.className='ent';b.innerHTML='<small>'+esc(fmt(k))+'</small><span>'+esc(clean(k).split('\n').slice(0,2).join(' ').slice(0,140))+'</span>';b.onclick=()=>{close();load(k)};L.appendChild(b)})}

 [...new Set([today,...keys()])].sort().reverse().forEach(k=>{const t=clean(k),f=fmt(k);
  if(q&&!(f.toLowerCase().includes(q)||k.includes(q)||t.toLowerCase().includes(q)))return;
  const h=f.split(' ').slice(-2).join(' ');if(h!==mo){mo=h;const d=document.createElement('h3');d.textContent=h;L.appendChild(d)}
  const b=document.createElement('button');b.className='ent';b.innerHTML='<small>'+esc(f)+(k===today?' · aujourd’hui':'')+'</small><span>'+esc(t.split('\n').slice(0,2).join(' ').slice(0,140)||'Page vierge')+'</span>';
  b.onclick=()=>{close();load(k)};L.appendChild(b)})}
$('q').oninput=list;
$('rnd').onclick=()=>{const ks=keys().filter(k=>k<today&&clean(k).trim());if(ks.length){close();load(ks[Math.floor(Math.random()*ks.length)])}else $('rnd').textContent='Aucune page passée pour l’instant.'};
const close=()=>document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
$('bl').onclick=()=>{save();close();$('lib').classList.add('on');list()};
$('bs').onclick=()=>{close();pan.classList.add('on')};
document.addEventListener('click',e=>{if(e.target.closest('[data-x]')){close();if(!readonly&&!touch)ta.focus()}});
$('date').onclick=()=>{if(viewing!==today)load(today)};
addEventListener('keydown',e=>{if(e.key==='Escape')close()});
let to;const sh=()=>{document.body.classList.add('show');clearTimeout(to);to=setTimeout(()=>document.body.classList.remove('show'),3200)};
['mousemove','touchstart'].forEach(e=>addEventListener(e,sh,{passive:true}));
sheet.addEventListener('pointerdown',()=>{if(!readonly)ta.focus()});
/* ---------- Ambiances de fond (synthétisées) ---------- */
let amInit=0,am=null;
function ambient(){amInit=1;if(am){am.stop();am=null}if(String(P.amb)==='0'||!+P.va)return;const c=A();if(c.state==='suspended')c.resume();
 const rain=P.amb==='rain',g=c.createGain();g.gain.value=0;g.gain.linearRampToValueAtTime(+P.va*(rain?.3:.8),c.currentTime+2);g.connect(c.destination);
 const nb=c.createBuffer(1,c.sampleRate*3,c.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 const src=c.createBufferSource();src.buffer=nb;src.loop=true;const f1=c.createBiquadFilter(),f2=c.createBiquadFilter();let iv=0;
 if(rain){f1.type='highpass';f1.frequency.value=500;f2.type='lowpass';f2.frequency.value=3200}
 else{f1.type='lowpass';f1.frequency.value=220;f2.type='lowpass';f2.frequency.value=220;
  iv=setInterval(()=>{if(Math.random()<.6){const s=c.createBufferSource();s.buffer=noise(c,.03+Math.random()*.04);const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1500+Math.random()*2500;const gn=c.createGain();gn.gain.value=(.1+Math.random()*.2)*+P.va*.6;s.connect(bp).connect(gn).connect(c.destination);s.start()}},170)}
 src.connect(f1).connect(f2).connect(g);src.start();
 am={stop(){clearInterval(iv);const t=c.currentTime;g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(g.gain.value,t);g.gain.linearRampToValueAtTime(0,t+.6);setTimeout(()=>{try{src.stop();g.disconnect()}catch(e){}},700)}}}
function kick(){if(!amInit)ambient()}
document.addEventListener('pointerdown',kick,{once:true});document.addEventListener('keydown',kick,{once:true});

/* ---------- Comptes et synchronisation (Supabase) ---------- */
let sb=null;try{if(SB_URL&&SB_KEY&&window.supabase)sb=window.supabase.createClient(SB_URL,SB_KEY)}catch(e){}
let col=null,cs='wait',pt,pushing=0,dirtyK=new Set(),lastSg='';
const MSG={local:'Mode local : vos pages restent sur cet appareil. Connectez-vous pour les retrouver sur tous vos appareils.',nosb:'Aucun serveur configuré : vos pages restent sur cet appareil (voir README.md).',wait:'Synchronisation en cours…',ok:'Synchronisé avec votre compte : vos pages et vos réglages vous suivent sur tous vos appareils.',off:'Hors ligne ou serveur injoignable : vous pouvez continuer à écrire, tout sera envoyé dès que possible.'};
function setStatus(x){cs=x;const e=$('syncinfo');if(e)e.textContent=(x==='local'&&!sb)?MSG.nosb:MSG[x];$('sy').textContent=x==='ok'?'☁':'·'}
function acct(){const e=$('acct');if(!e||!sb)return;e.innerHTML=col?'<div class="l">Connecté : '+esc(col.email||'')+'</div><button class="big" id="so">Se déconnecter</button>':'<button class="big" id="si">Se connecter ou créer un compte</button>'}
function qp(k){dirtyK.add(k);if(k.startsWith('day-'))S('dt:dirty:'+k.slice(4),'1');if(col){clearTimeout(pt);pt=setTimeout(push,1500)}}
const pad=(m,t)=>(m+'0'.repeat(t.length)).slice(0,t.length);
const orM=(a,b)=>[...a].map((x,i)=>(x==='1'||b[i]==='1')?'1':'0').join('');
async function push(){if(!col||pushing)return;if(!navigator.onLine){setStatus('off');return}pushing=1;let fail=0;
 for(const k of [...dirtyK]){dirtyK.delete(k);try{
  if(k==='prefs'){const r=await sb.from('prefs').upsert({user_id:col.id,data:P,t:+(G('dt:prefsT')||Date.now())});if(r.error)throw r.error}
  else{const d=k.slice(4),text=G('dt:day:'+d)||'';if(!text)continue;
   const body={text,mask:pad(G('dt:mask:'+d)||'',text),client_ts:+(G('dt:edit:'+d)||Date.now())};
   const r=await sb.from('entries').upsert({...body,user_id:col.id,day:d},{onConflict:'user_id,day'}).select('ver').single();
   if(r.error){if(/LOCKED/.test(r.error.message||'')){S('dt:lock:'+d,'1');S('dt:dirty:'+d,'0');continue}throw r.error}
   S('dt:base:'+d,r.data.ver);if((G('dt:day:'+d)||'')===text)S('dt:dirty:'+d,'0')}
 }catch(e){fail=1;dirtyK.add(k)}}
 pushing=0;if(fail){setStatus('off');setTimeout(push,25000)}else{setStatus('ok');if(dirtyK.size)push()}}
function refreshEd(d){const pos=ta.selectionStart,t=G('dt:day:'+d)||'',sm=G('dt:mask:'+d)||'';ta.value=t;val0=t;mk=t.split('').map((_,i)=>sm[i]==='1'?1:0);const q=Math.min(pos,t.length);ta.setSelectionRange(q,q);render()}
function mergeDay(d,c){const t=G('dt:day:'+d)||'',ct=c.text,lm=pad(G('dt:mask:'+d)||'',t),cm=pad(c.mask||'',ct);
 const take=(tx,m2)=>{S('dt:day:'+d,tx);S('dt:mask:'+d,m2);S('dt:base:'+d,c.t||0);S('dt:dirty:'+d,'0');if(viewing===d)refreshEd(d)};
 if(t===ct){const om=orM(lm,cm);if(om!==lm){S('dt:mask:'+d,om);if(viewing===d)refreshEd(d)}
  if(om!==cm)qp('day-'+d);else{S('dt:base:'+d,c.t||0);S('dt:dirty:'+d,'0')}return}
 const base=+(G('dt:base:'+d)||0),dl=G('dt:dirty:'+d)==='1'||(base===0&&t.length>0);
 if(c.t===base){qp('day-'+d);return}
 if(!dl){take(ct,cm);return}
 if(ct.startsWith(t)){take(ct,orM(cm,lm));return}
 if(t.startsWith(ct)){S('dt:mask:'+d,orM(lm,cm));S('dt:base:'+d,c.t||0);if(viewing===d)refreshEd(d);qp('day-'+d);return}
 S('dt:day:'+d,t+'\n'+ct);S('dt:mask:'+d,lm+'0'+cm);S('dt:base:'+d,c.t||0);qp('day-'+d);if(viewing===d)refreshEd(d)} /* vrai conflit : on garde les deux textes, rien n'est perdu */
function mergePrefs(c){const t=+(G('dt:prefsT')||0);if(c.t>t){try{P=Object.assign({},D,JSON.parse(c.json));S('dt:prefs',JSON.stringify(P));S('dt:prefsT',c.t);apply();mark();if(amInit)ambient()}catch(e){}}else if(c.t<t)qp('prefs')}
async function pull(){const [a,b]=await Promise.all([sb.from('entries').select('day,text,mask,ver'),sb.from('prefs').select('data,t').maybeSingle()]);
 if(a.error)throw a.error;if(b.error)throw b.error;a.data.forEach(r=>mergeDay(r.day,{text:r.text,mask:r.mask,t:r.ver}));
 if(b.data)mergePrefs({json:JSON.stringify(b.data.data),t:+b.data.t});
 const ids=new Set(a.data.map(r=>r.day));keys().forEach(d=>{if(!ids.has(d))qp('day-'+d)});if($('lib').classList.contains('on'))list()}
async function signOut(){if(dirtyK.size&&!confirm('Certaines pages ne sont pas encore envoyées. Se déconnecter les effacera de cet appareil. Continuer ?'))return;
 const ks=[];for(let i=0;i<localStorage.length;i++)ks.push(localStorage.key(i));ks.forEach(k=>{if(NS&&k.startsWith(NS))localStorage.removeItem(k)});await sb.auth.signOut()}
const am_=m=>{$('amsg').textContent=m};
async function doAuth(mode){const email=$('aem').value.trim(),pw=$('apw').value;if(!email||!pw)return am_('Renseignez votre e-mail et un mot de passe.');am_('…');
 const r=mode==='in'?await sb.auth.signInWithPassword({email,password:pw}):await sb.auth.signUp({email,password:pw,options:{data:{tz:Intl.DateTimeFormat().resolvedOptions().timeZone}}});
 if(r.error)return am_(r.error.message);if(mode==='up'&&!r.data.session)am_('Compte créé. Vérifiez votre boîte mail pour confirmer, puis connectez-vous.')}
$('ain').onclick=()=>sb&&doAuth('in');$('aup').onclick=()=>sb&&doAuth('up');
$('agg').onclick=()=>sb&&sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});
$('afg').onclick=async()=>{const e=$('aem').value.trim();if(!sb||!e)return am_('Saisissez d’abord votre e-mail.');const r=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});am_(r.error?r.error.message:'Un e-mail de réinitialisation vous a été envoyé.')};
$('ano').onclick=()=>{try{localStorage.setItem('dt:anon','1')}catch(e){}$('auth').classList.remove('on');if(!readonly&&!touch)ta.focus()};
addEventListener('online',()=>{if(col)push()});addEventListener('offline',()=>{if(col)setStatus('off')});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&col)pull().catch(()=>{})});
setInterval(()=>{if(col&&dirtyK.size)push()},25000);
(async()=>{if(!sb){setStatus('local');return}
 sb.auth.onAuthStateChange((ev,ses)=>{if(ev==='PASSWORD_RECOVERY'){const np=prompt('Choisissez un nouveau mot de passe');if(np)sb.auth.updateUser({password:np}).then(r=>alert(r.error?r.error.message:'Mot de passe modifié.'));return}
  const id=ses&&ses.user?ses.user.id+':':'';if((ev==='SIGNED_IN'||ev==='SIGNED_OUT')&&id!==NS)location.reload()});
 const {data}=await sb.auth.getSession(),ses=data.session;
 if(!ses){setStatus('local');if(localStorage.getItem('dt:anon')!=='1')$('auth').classList.add('on');acct();return}
 col=ses.user;acct();setStatus('wait');
 try{const pr=await sb.from('profiles').select('tz').maybeSingle();
  if(pr.data&&!pr.data.tz){const z=Intl.DateTimeFormat().resolvedOptions().timeZone;const u=await sb.from('profiles').update({tz:z}).eq('user_id',col.id);if(!u.error)pr.data.tz=z}
  if(pr.data&&pr.data.tz&&G('dt:tz')!==pr.data.tz){S('dt:tz',pr.data.tz);location.reload();return}
  await pull();
  sb.channel('dt-'+col.id).on('postgres_changes',{event:'*',schema:'public',table:'entries',filter:'user_id=eq.'+col.id},p=>{const r=p.new;if(r&&r.day)mergeDay(r.day,{text:r.text,mask:r.mask,t:r.ver})})
   .on('postgres_changes',{event:'*',schema:'public',table:'prefs',filter:'user_id=eq.'+col.id},p=>{const r=p.new;if(r&&r.data)mergePrefs({json:JSON.stringify(r.data),t:+r.t})}).subscribe();
  if(dirtyK.size)push();else setStatus('ok')}catch(e){setStatus('off')}})();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});

ui();mark();apply();load(today);sh();setStatus(cs);acct();
requestAnimationFrame(()=>setTimeout(()=>{$('intro').style.opacity=0},300));
</script></body></html>
